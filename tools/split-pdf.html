<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF — PDFKit</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="tool-header" id="toolHeader"></div>

<div class="container">
  <div class="workspace" id="workspace">
    <aside class="panel" id="sidePanel" style="display:none">
      <h3>Split Settings</h3>
      <div class="field">
        <label>Split mode</label>
        <div class="seg" id="modeSeg">
          <button data-v="every" class="active">Every page</button>
          <button data-v="fixed">Fixed size</button>
          <button data-v="ranges">Ranges</button>
        </div>
      </div>
      <div class="field" id="fixedField" style="display:none">
        <label>Pages per file</label>
        <div class="number-stepper">
          <button id="fixedMinus">−</button>
          <input type="number" id="fixedCount" value="2" min="1">
          <button id="fixedPlus">+</button>
        </div>
      </div>
      <div class="field" id="rangesField" style="display:none">
        <label>Page ranges</label>
        <input type="text" id="rangesInput" placeholder="e.g. 1-3, 4-6, 9">
        <div class="hint">Comma-separate ranges. Each becomes its own PDF.</div>
      </div>
      <button class="btn btn-primary btn-block" id="splitBtn">✂️ Split PDF</button>
      <div class="ad-sidebar" data-ad="sidebar"></div>
    </aside>

    <div class="main-area">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">✂️</div>
        <h3>Select a PDF to split</h3>
        <p>Drag &amp; drop a PDF here, or click to browse.</p>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>
      <div class="thumb-grid" id="thumbGrid"></div>
      <div class="preview-stage" id="stage" style="display:none;margin-top:20px"></div>
    </div>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/tools/split-pdf.js"></script>
</body>
</html>
