<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel to PDF — PDFKit</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="tool-header" id="toolHeader"></div>

<div class="container">
  <div class="workspace" id="workspace">
    <aside class="panel" id="sidePanel" style="display:none">
      <h3>Sheet</h3>
      <div class="field">
        <label>Choose sheet</label>
        <select id="sheetSel"></select>
      </div>
      <div class="field">
        <label>Orientation</label>
        <div class="seg" id="orientSeg"><button data-v="landscape" class="active">Landscape</button><button data-v="portrait">Portrait</button></div>
      </div>
      <button class="btn btn-primary btn-block" id="exportBtn">📈 Export as PDF</button>
      <div class="ad-sidebar" data-ad="sidebar"></div>
    </aside>

    <div class="main-area">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon">📈</div>
        <h3>Select a spreadsheet</h3>
        <p>Drag &amp; drop .xlsx / .xls / .csv, or click to browse.</p>
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      </div>
      <div class="preview-stage" id="previewStage" style="display:none;overflow:auto"></div>
      <div class="preview-stage" id="stage" style="display:none;margin-top:20px"></div>
    </div>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/tools/excel-to-pdf.js"></script>
</body>
</html>
