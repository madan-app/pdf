<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF — PDFKit</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header id="site-header"></header>
<div class="tool-header" id="toolHeader"></div>

<div class="container">
  <div class="ad-inline" data-ad="inline"></div>
  <div class="workspace no-sidebar">
    <div class="main-area">

      <div class="dropzone" id="dropzone">
        <div class="dz-icon">🔗</div>
        <h3>Add PDF files to merge</h3>
        <p>Drag &amp; drop PDFs here, or click to browse. Files stay on your device.</p>
        <input type="file" id="fileInput" accept="application/pdf" multiple>
      </div>

      <div class="file-list" id="fileList"></div>

      <div class="actions-row" id="actionsRow" style="display:none">
        <button class="btn btn-primary" id="mergeBtn">🔗 Merge PDFs</button>
        <button class="btn btn-secondary" id="clearBtn">Clear all</button>
      </div>

      <div class="preview-stage" id="stage" style="display:none;margin-top:20px"></div>
    </div>
  </div>
</div>

<footer id="site-footer"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/tools/merge-pdf.js"></script>
</body>
</html>
